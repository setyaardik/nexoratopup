services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora_game
    ports:
      - "5433:5432"
    volumes:
      - nexora_db_data:/var/lib/postgresql/data

volumes:
  nexora_db_data:
